<div class="modal-header">
    <h3 id="myModalLabel" id="lLoginLabel"></h3>
</div>

<div class="modal-body">
    <p id="lLoginHint"></p>

    <label id="lLoginUser"></label>
    <input type="text" id="iusername" class="input-xlarge">

    <label id="lLoginPassword"></label>
    <input type="password" id="ipassword" class="input-xlarge" onkeydown = "if (event.keyCode == 13) $('#lLoginSignIn').click()">

    <p id="LoginStatus"></p>
</div>

<div class="modal-footer">
    <div class="pull-left" id="modal_loginState_value"></div> <div class="pull-right"><button class="btn btn-primary"  onclick="send_login();" id="lLoginSignIn"></button></div>
    <div class="row" style="margin-top: 10px; margin-left: 100px;">
        <div class="span1"><div class="img_clip_icon_ger_flag"><img onclick="_lang_selector_onchange(0)" alt="German" src="./img/all_images.gif" class="img-button"></div></div>
        <div class="span1"><div class="img_clip_icon_eng_flag"><img onclick="_lang_selector_onchange(1)" alt="English" src="./img/all_images.gif" class="img-button"></div></div>
        <div class="span1"><div class="img_clip_icon_it_flag"><img onclick="_lang_selector_onchange(2)" alt="Italian" src="./img/all_images.gif" class="img-button"></div></div>
    </div>
</div>
