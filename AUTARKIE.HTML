
<script type="text/javascript">
    var date = false;
    
    function getYearTotalAutarkie()
    {
        var inityear = $("#STATISTICSTAT_YEAR_START").html() * 1;
        var year_now = $("#RTCWEB_TIME_YEAR").html() * 1;
        var ind = (year_now - inityear) + 1;      
        console.log("year total house " + $("#STATISTICSTAT_YEAR_E_HOUSE_ARR" + ind).html() * 1);
        console.log("year total grid " + $("#STATISTICSTAT_YEAR_E_GRID_IMP_ARR" + ind).html() * 1);
        if ($("#STATISTICSTAT_YEAR_E_HOUSE_ARR" + ind).html() * 1 != 0)
        {
            return (1 - ($("#STATISTICSTAT_YEAR_E_GRID_IMP_ARR" + ind).html() / $("#STATISTICSTAT_YEAR_E_HOUSE_ARR" + ind).html())) * 100;
        }
        else if($("#STATISTICSTAT_YEAR_E_GRID_IMP_ARR" + ind).html()*1 == $("#STATISTICSTAT_YEAR_E_HOUSE_ARR" + ind).html()*1)
        {
            return 100;
        }
        else
        {
            return 0;
        }
    }

    function getTotalAutarkie()
    {
        var house_total = 0;
        var grid_import_total = 0;
        for (i = 0; i < 31; i++)
        {
            house_total += $("#STATISTICSTAT_YEAR_E_HOUSE_ARR" + i).html() * 1;
            grid_import_total += $("#STATISTICSTAT_YEAR_E_GRID_IMP_ARR" + i).html() * 1;   
        }
        
        console.log("total house " + house_total);
        console.log("total grid " +  grid_import_total);
        
        if (house_total != 0) {
            return  (1 - (grid_import_total / house_total)) * 100;
        } 
        else if (grid_import_total == house_total)
        {
            return 100;
        }
        else
        {
            return 0;
        }

        var ind = (year_now - inityear) + 1;
        $("#STATISTICSTAT_YEAR_E_HOUSE_ARR" + ind).html() * 1;
        
        if ($("#STATISTICSTAT_YEAR_E_HOUSE_ARR" + ind).html() * 1 != 0)
        {
            return (1 - ($("#STATISTICSTAT_YEAR_E_GRID_IMP_ARR" + ind).html() / $("#STATISTICSTAT_YEAR_E_HOUSE_ARR" + ind).html())) * 100;
        }
        else if ($("#STATISTICSTAT_YEAR_E_HOUSE_ARR" + ind).html() * 1 == $("#STATISTICSTAT_YEAR_E_GRID_IMP_ARR" + ind).html() * 1)
        {
            return 0;
        }
        else
        {
            return 100;
        }

    }
    
    // Fetch date
    function updateDataCB()
    {
        date = ($("#RTCWEB_TIME_YEAR").html() * 1) + "-" + $("#RTCWEB_TIME_MONTH").html() + "-" + $("#RTCWEB_TIME_DAY").html();
    }
    
    function SingleUpdateCB()
    {
        var powersaving = roundValue(getPowerSaving(), 1);
        $('#PowerSaving').text(powersaving + " kWh");
        $('#CO2Savings').text(roundValue((powersaving * 0.555), 3) + " kg");
    }

    function obj_init() {
        pageObj = new senecPage(SingleUpdateCB);
        pageObj.add_json_object("STATISTIC");
        pageObj.singlePageRefresh();
        pageObj.reInitJSONObject();
        // Update date
        updateDataCB();
    }
    
    // Summe Hausverbrauch - Netzbezug der letzten 30 Jahre
    function getPowerSaving()
    {
        var house_total = 0;
        var grid_import_total = 0;
        var result = 0;
        for (i = 0; i < 31; i++)
        {
            house_total += $("#STATISTICSTAT_YEAR_E_HOUSE_ARR" + i).html() * 1;
            grid_import_total += $("#STATISTICSTAT_YEAR_E_GRID_IMP_ARR" + i).html() * 1;
        }
        result = house_total - grid_import_total;
        console.log("house_total result "+house_total);
        console.log("grid_import_total result "+grid_import_total);
        console.log("power save result "+result);
        if (result < 0)
        {
            result = 0;
        }
        return result;
    }

    $(document).bind("page.loaded", function() {
        $('#hCategoryName').empty();
        $('#hCategoryName').text(lng["lAutarkyHeader"]);
        $('#hCategoryHeader').removeClass('hidden').show();
        updateLanguage();
        obj_init();
        $("#chartdiv").html(lng.lChartsWait);
        //Die letzten 31 Tage
        var statMonth = getStatisticFileAsArray(date, 31);
        // letzte 24h / Woche / Monat [0-2]
        var autarkiedata = processAutarkieData(statMonth);

        autarkiedata[3] = [lng.YEAR, Math.round(getYearTotalAutarkie())],
        autarkiedata[4] = [lng.OVERALL, Math.round(getTotalAutarkie())],
        
                //-----create autarkie plot--------------//
        AutarkieChart_init(autarkiedata, "chartdiv");
        $('#autarky24h').text(Math.min(Math.max(autarkiedata[0][1], 0), 100) + " %");
        $('#currentWeekDataAutarky').text(Math.min(Math.max(autarkiedata[1][1], 0), 100) + " %");
        $('#currentMonthDataAutarky').text(Math.min(Math.max(autarkiedata[2][1], 0), 100) + " %");
        $('#currentYearDataAutarky').text(Math.min(Math.max(autarkiedata[3][1], 0), 100) + " %");
        $('#OverallDataAutarky').text(Math.min(Math.max(autarkiedata[4][1], 0), 100) + " %");
    });

    $(document).bind("page.unload", function() {
        $('#hCategoryHeader').addClass('hidden').hide();
        pageObj.stopPageRefresh();
    });
</script>
