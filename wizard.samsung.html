<div class="modal-header">
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true" id="btnWizardSamsung_close" onclick="confwizardSamsungClose();">×</button>
    <h3 id="lBatteryHeader"></h3>
</div>

<div id="pnWizardSamsungModalBody" class="modal-body" style="height:800px;">
    <!-- Step 1: Prompt user to plugin communication cable to internal CAN -->
    <div id="SamsungWizardStart"></div>

    <!-- Step 2: Amuse user while scanning for battery modules -->
    <div id="SamsungWizardScanning"></div>

    <!-- Step 3: Prompt user to confirm detected module count -->
    <div id="SamsungWizardDetected"></div>

    <!-- Step 3a: No modules detected -->
    <div id="SamsungWizardDetectedFailed"></div>

    <!-- Step 4: Prompt user to plugin communication cable to external CAN -->
    <div id="SamsungWizardSwitchCan"></div>

    <!-- Step 5: Amuse user while perfoming equalization and test charging -->
    <div id="SamsungWizardCharging" style="text-align: center;">
        <img src="img/samsung_wizard3.png" style="width: 330px;">
        <div class="samsung-module0" id="SamsungInfo0"></div>
        <div class="samsung-module1" id="SamsungInfo1"></div>
        <br><br>
        <div style="display: flex; align-items: center; justify-content:center;">
          <div id="tiny-loader"></div>
          <div id="SamsungWizardChargingInfo"></div>
        </div>
    </div>

    <!-- Step 6a: Prompt user to finish wizard -->
    <div id="SamsungWizardDone"></div>

    <!-- Step 6b: Charging was not successful -->
    <div id="SamsungWizardFailed"></div>
</div>

<div class="modal-footer">
    <button class="btn btn-wizard" onclick="sendSamsungCommand('Start')" id="SamsungStart" style="float: left;"></button>
    <button class="btn btn-wizard" onclick="sendSamsungCommand('Confirm')" id="SamsungConfirm"></button>
    <button class="btn btn-wizard" onclick="confwizardSamsungClose()" id="SamsungClose"></button>
</div>
