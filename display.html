<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <link rel="icon" href="/img/favicon.ico" type="image/x-icon" />
        <script src="./js/jquery-3.2.1.min.js" type="text/javascript"></script>
    </head>

    <body>
        <div style="position: relative">
            <object type="image/svg+xml" id="display"></object>
            <div id="displayDiv" style="position: absolute">
                <canvas id="displayCanvas" />
            </div>
        </div>

        <script type="text/javascript">
            const display = document.getElementById('display');
            const displayCanvas = document.getElementById('displayCanvas');
            const ctx = displayCanvas.getContext('2d');
            var sysTypeIsPb = false;
            var ledPassive;
            var ledCharge;
            var ledDischarge;
            var ledError;
            var pixelColor = "#000000";

            var displayLastUpdate = Date.now();
            var systemType = {
                Senec_Home_8_0_Pb : 0,
                Senec_Business_30_0_Pb : 1,
                SOLARINVERT_Storage_10_0_Pb : 2,
                Senec_Home_4_0_Pb : 3,
                Senec_Home_5_0_10_0_Li_Panasonic : 4,
                Senec_Home_15_0_Li_Panasonic : 5,
                Senec_Business_25_0_Li_Panasonic : 6,
                Senec_Home_6_0_Pb : 7,
                Senec_Home_10_0_Pb : 8,
                Senec_Home_2_5_10_0_Li_V2_Panasonic : 9,
                Senec_Business_30_0_Pb_V2 : 10,
                Senec_Home_10_0_Pb_V2 : 11,
                System_Type_Dummy : 12,
                Senec_Business_Li_2ph : 13,
                Senec_Business_Li_3ph : 14,
                Senec_Home_Li_BMZ_V21 : 15,
                Senec_Home_G23_refit_adstec : 16,
                Senec_Home_V3_Hybrid : 17,
                Senec_Home_V3_Hybrid_duo : 18
            };

            /* check if device has type Pb */
            function sysTypeIsPbCheck(sysType)
            {
                if((sysType === systemType.Senec_Home_8_0_Pb) ||
                   (sysType === systemType.Senec_Business_30_0_Pb) ||
                   (sysType === systemType.SOLARINVERT_Storage_10_0_Pb) ||
                   (sysType === systemType.Senec_Home_4_0_Pb) ||
                   (sysType === systemType.Senec_Home_6_0_Pb) ||
                   (sysType === systemType.Senec_Home_10_0_Pb) ||
                   (sysType === systemType.Senec_Business_30_0_Pb_V2) ||
                   (sysType === systemType.Senec_Home_10_0_Pb_V2))
                {
                    return true;
                }

                return false;
            }

            /* make jshint silent for connX50UpdateCb: */
            /* exported displayRequestCb */
            function displayUpdateCb(data)
            {
                var respObj = $.parseJSON(JSON.stringify(data));
                var byteArray = [];

                // check if response is an object
                if ($.type(respObj) !== "object") {
                    console.log("Error: Parsing JSON response not possible.");
                    return;
                }

                // check if DISPLAY object is available
                if (typeof(respObj.DISPLAY) === "undefined") {
                    console.log("Error: DISPLAY object not available.");
                    return;
                }

                // convert LED states
                var leds = parseInt("0x" + respObj.DISPLAY.LEDS.substr(3,2));
                ledPassive.style.fill = (leds & (1 << 7)) ? "#008d36" : "#fff";
                ledCharge.style.fill = (leds & (1 << 3)) ? "#008d36" : "#fff";
                ledDischarge.style.fill = (leds & (1 << 2)) ? "#008d36" : "#fff";
                ledError.style.fill = (leds & 1) ? "#e30613" : "#fff";
                if(sysTypeIsPb === true)
                {
                    ledWater = (leds & (1 << 1)) ? "#e30613" : "#fff";
                }

                // convert IMAGE variable to pixel bytes
                for(var cnt = 0; cnt < respObj.DISPLAY.IMAGE.length; cnt++)
                {
                    byteArray.push(parseInt("0x" + respObj.DISPLAY.IMAGE[cnt].substr(9,2)));
                    byteArray.push(parseInt("0x" + respObj.DISPLAY.IMAGE[cnt].substr(7,2)));
                    byteArray.push(parseInt("0x" + respObj.DISPLAY.IMAGE[cnt].substr(5,2)));
                    byteArray.push(parseInt("0x" + respObj.DISPLAY.IMAGE[cnt].substr(3,2)));
                }

                // draw on canvas
                for(var y = 0; y < 64; y++)
                {
                    for(var x = 0; x < 132; x++)
                    {
                        var xRot = 132 - 1 - x;
                        var yRot = 64 - 1 - y;
                        var arrayPos = xRot + ((yRot >> 3) * 132);
                        var valArray = byteArray[arrayPos];
                        var valPixel = (valArray >> (yRot & 7)) & 1;
                        ctx.fillStyle = (valPixel) ? "#000000" : pixelColor;
                        ctx.fillRect(x * 1, y * 1, 1, 1);
                    }
                }

                // update timestamp
                displayLastUpdate = Date.now();
            }

            function initSysType()
            {
                $.ajax({
                    type: "POST",
                    async: true,
                    url: "/lala.cgi",
                    data: JSON.stringify({"FACTORY":{"SYS_TYPE":""}}),
                    dataType: "json",
                    success: initSysTypeCb,
                    error: initSysType,
                    timeout: 3000,
                });
            }

            function initSysTypeCb(data)
            {
                var respObj = $.parseJSON(JSON.stringify(data));

                // check if response is an object
                if ($.type(respObj) !== "object") {
                    console.log("Error: Parsing JSON response not possible.");
                    return;
                }

                // check if object is available
                if (typeof(respObj.FACTORY) === "undefined") {
                    console.log("Error: FACTORY object not available.");
                    return;
                }

                // query system type
                sysTypeIsPb = sysTypeIsPbCheck(parseInt("0x" + respObj.FACTORY.SYS_TYPE.substr(3,2)));

                // load matching SVG image
                display.addEventListener('load', initSvgCb);
                if(sysTypeIsPb === false)
                {
                    display.setAttribute('data', 'img/display_v2_1.svg');
                    pixelColor = "#ccdae4";

                }
                else
                {
                    display.setAttribute('data', 'img/display_pb.svg');
                    pixelColor = "#989898";
                }
            }

            function initSvgCb()
            {
                /* positionate canvas */
                const displayCont = display.contentDocument;
                const pixelDisplay = displayCont.getElementById('pixelDisplay').getBoundingClientRect();
                displayCanvas.width = '132';
                displayCanvas.height = '64';
                displayCanvas.style.width = pixelDisplay.width + 'px';
                displayCanvas.style.height = pixelDisplay.height + 'px';
                displayDiv.style.left = (pixelDisplay.x + display.offsetLeft) + 'px';
                displayDiv.style.top = (pixelDisplay.y + display.offsetTop) + 'px';

                ledPassive = displayCont.getElementById('ledPassive');
                ledCharge = displayCont.getElementById('ledCharge');
                ledDischarge = displayCont.getElementById('ledDischarge');
                ledError = displayCont.getElementById('ledError');
                ledWater = displayCont.getElementById('ledWater');

                // request display update
                setInterval(displayUpdateReq, 5000);
                displayUpdateReq();
            }

            function displayUpdateReq()
            {
                $.ajax({
                    type: "POST",
                    async: true,
                    url: "/lala.cgi",
                    data: JSON.stringify({"DISPLAY":{"IMAGE":"","LEDS":""}}),
                    dataType: "json",
                    success: displayUpdateCb,
                    error: displayError,
                    timeout: 5000,
                });
            }

            function displayError()
            {
                if((Date.now() - displayLastUpdate) > 30000)
                {
                    var image = ctx.getImageData(0, 0, 132, 64);
                    for(var cnt = 0; cnt < (132 * 64); cnt++)
                    {
                        image.data[cnt * 4 + 3] = 132;
                    }
                    ctx.putImageData(image, 0, 0);
                }
            }

            window.addEventListener("load", initSysType);
        </script>
    </body>
</html>
