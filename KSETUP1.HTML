<script type="text/javascript">
/** Prevent JSHint warning about supposingly unused functions. */
/* exported ChargebtnClickEvent, DischargebtnClickEvent, CapacityTestbtnClickEvent, UserRebootClickEvent, UpdateIntegrationTest, startGridParameterWizard, fanTestProcess, startPVWizard, triggerSelftest, triggerLogRotate, triggerHvUpdate, triggerLvUpdate, triggerNspUpdate, triggerInverterUpdate */

    var pageObj;

    var chargeState = 0;
    var dischargeState = 0;
    var CapacityTestState = 0;

    function singleUpdateCB()
    {
        // Testleistung
        $('#itestpower').val($("#ENERGYGRID_POWER_OFFSET").html());

        // Steckdose 1
        if (htmlAsNumber("#ENERGYGUI_POW_SOCK_0_FORCE_ON") == 1)
        {

            $('#inputSocket1ForceOn').attr("checked", true);
        }
        else
        {
            $('#inputSocket1ForceOn').attr("checked", false);
        }

        // Steckdose 2
        if (htmlAsNumber("#ENERGYGUI_POW_SOCK_1_FORCE_ON") == 1)
        {

            $('#inputSocket2ForceOn').attr("checked", true);
        }
        else
        {
            $('#inputSocket2ForceOn').attr("checked", false);
        }

        // Pumpe
        if (htmlAsNumber("#ENERGYGUI_FACTORY_TEST_PUMP") == 1)
        {

            $('#inputPumpEnable').attr("checked", true);
        }
        else
        {
            $('#inputPumpEnable').attr("checked", false);
        }

        // XCOM
        if (htmlAsNumber("#ENERGYGUI_FACTORY_TEST_XCOM") == 1)
        {

            $('#inputRelaisEnable').attr("checked", true);
        }
        else
        {
            $('#inputRelaisEnable').attr("checked", false);
        }

        // Auto Zyklus
        if (htmlAsNumber("#ENERGYTEST_CYCLE") & 1)
        {

            $('#AutoCycleEnable').attr("checked", true);
        }
        else
        {
            $('#AutoCycleEnable').attr("checked", false);
        }
        // Auto Zyklus Inverter Update
        if (htmlAsNumber("#ENERGYTEST_CYCLE") & 2)
        {

            $('#AutoInverterUpdate').attr("checked", true);
        }
        else
        {
            $('#AutoInverterUpdate').attr("checked", false);
        }
        // Auto Zyklus NSP Update
        if (htmlAsNumber("#ENERGYTEST_CYCLE") & 4)
        {

            $('#AutoNSPUpdate').attr("checked", true);
        }
        else
        {
            $('#AutoNSPUpdate').attr("checked", false);
        }

        // Internetnutzung
        if (htmlAsNumber("#WIZARDNET_SENEC_NO_NETWORK") == 0)
        {
            $('#inputToggleUseNetwork').attr("checked", true);
        }
        else
        {
            $('#inputToggleUseNetwork').attr("checked", false);
        }

        // Akku Schutzbetrieb
        if (htmlAsNumber("#ENERGYGUI_SAFETY_CHARGE") == 1)
        {
            $('#inputToggleBatteryProtection').attr("checked", true);
        }
        else
        {
            $('#inputToggleBatteryProtection').attr("checked", false);
        }

        // Status Spezialladungen Pausiert
        if (htmlAsNumber("#ENERGYGUI_PAUSE_SPECIAL") == 1)
        {
            $('#inputTogglePauseSpecialCharge').attr("checked", true);
        }
        else
        {
            $('#inputTogglePauseSpecialCharge').attr("checked", false);
        }

        // Check if there is a second enfluri
        if (htmlAsNumber("#WIZARDDEVICE_PM_HOUSE_ENABLED") == 1)
        {
            $('.pm_house').show();
            $('.pv_inverter').hide();
        }
        else
        {
            $('.pm_house').hide();
            $('.pv_inverter').show();
        }

        // Check Modbus config
        switch(htmlAsNumber("#WIZARDMASTER_SLAVE_MODE"))
        {
            default:
            case 0: //Not configured
                $('.modusmaster').hide();
                $('.modusslave').hide();
                $('.modbus').hide();
                break;
            case 1: //Master
                $('.modusmaster').show();
                $('.modusslave').hide();
                $('.modbus').show();
                break;
            case 2: //Slave
                $('.modusslave').show();
                $('.modusmaster').hide();
                $('.modbus').show();
                $('.single_system').hide();
                break;
        }

        // Check Powerunit
        for (c = 0; c < 6; c++) {
            // Check if any enabled
            if(htmlAsNumber('#PWR_UNITTYPE' + c) &&
               htmlAsNumber("#FEATURESHEAT") == 1) {
              $('.pwr_unit').show();
              }
            else
           	{
            	$('.pwr_unit').hide();
           	}
        }

        // Check EG config
        if(htmlAsNumber("#EG_CONTROLACTIVE") == 0){
            $('.eg_active').hide();
        }else{
            $('.eg_active').show();
        }

        // Check Country Setting and Feature Allowance
        if(htmlAsNumber("#FACTORYCOUNTRY") != 0 || // Not Germany
           htmlAsNumber("#FEATURESECOGRIDREADY") == 0){ // Feature not allowed
            $('.eg_active').hide();
            $('.eg_allowed').hide();
        }

        //check overwrite of features
        if (htmlAsNumber("#SYS_UPDATEFEATURE_OVERWRITE") == 1)
        {

            $('#inputOverwriteFeatures').attr("checked", true);
        }
        else
        {
            $('#inputOverwriteFeatures').attr("checked", false);
        }

        if (htmlAsNumber("#fullWizard") == 1)
        {

            $('#inputFullWizard').attr("checked", true);
        }
        else
        {
            $('#inputFullWizard').attr("checked", false);
        }

        /* Fantest already active */
        if (htmlAsNumber("#ENERGYGUI_FACTORY_TEST_FAN") == 1) {
            $("#fanTest").attr("disabled", false);
            $("#fanTest").text(lng.lConfirmFanTest);
        }
        else
        {
            $("#fanTest").text(lng.lStartFanTest);
        }
    }

    function updateCB()
    {
        if (htmlAsNumber("#ENERGYGUI_TEST_CHARGE_STAT") == 1)
        {
            chargeState = 1;
            $('#GuiDataTestChargeChargebtn').css({"border": "1px solid var(--main-color)"});
        }
        else
        {
            chargeState = 0;
            $('#GuiDataTestChargeChargebtn').css({"border": "0px solid var(--main-color)"});
        }

        if (htmlAsNumber("#ENERGYGUI_TEST_DISCHARGE_STAT") == 1)
        {
            dischargeState = 1;
            $('#GuiDataTestChargeDischargebtn').css({"border": "1px solid var(--main-color)"});
        }
        else
        {
            dischargeState = 0;
            $('#GuiDataTestChargeDischargebtn').css({"border": "0px solid var(--main-color)"});
        }

        if (htmlAsNumber("#ENERGYGUI_CAP_TEST_STATE") == 1)
        {
            CapacityTestState = 1;
            $('#GuiDataCapacityTestBTN').css({"border": "1px solid var(--main-color)"});
        }
        else
        {
            CapacityTestState = 0;
            $('#GuiDataCapacityTestBTN').css({"border": "0px solid var(--main-color)"});
        }

        if (htmlAsNumber("#SYS_UPDATEUSER_REBOOT_DEVICE") == 1)
        {
            $('#RebootDevicebtn').css({"border": "1px solid var(--main-color)"});
        }
        else
        {
            $('#RebootDevicebtn').css({"border": "0px solid var(--main-color)"});
        }

        $('#inputClearRemanentData').attr("checked", htmlAsNumber('#STATISTICSTAT_REQ_CLEAR_REM_DATA') == 1);

        if (!(htmlAsNumber("#PM1PWR_METERS_MISSING") & 0x01)) {
            $('#inputRS485CommPM1').text("OK");
        } else {
            $('#inputRS485CommPM1').text("***");
        }

        if (!(htmlAsNumber("#PM1PWR_METERS_MISSING") & 0x02)) {
            $('#inputRS485CommPM2').text("OK");
        } else {
            $('#inputRS485CommPM2').text("***");
        }

        if (htmlAsNumber("#BAT1BATTERIES_MISSING") == 0) {
            $('#inputXComCommOk').text("OK");
        } else {
            $('#inputXComCommOk').text("***");
        }

        if (htmlAsNumber("#PV1PV_MISSING") == 0) {
            $('#inputRS485CommInverter').text("OK");
        } else {
            $('#inputRS485CommInverter').text("***");
        }

        if (htmlAsNumber("#PWR_UNITPU_MISSING") == 0) {
            $('#inputRS485PwrUnit').text("OK");
        } else {
            $('#inputRS485PwrUnit').text("***");
        }

        if (htmlAsNumber("#EG_CONTROLEG_SW_ERROR") == 0) {
            $('#inputRS485EGSw').text("OK");
        } else {
            $('#inputRS485EGSw').text("***");
        }

        if (htmlAsNumber("#EG_CONTROLEG_MTR_ERROR") == 0) {
            $('#inputRS485EGMtr').text("OK");
        } else {
            $('#inputRS485EGMtr').text("***");
        }

        if (htmlAsNumber("#PM1MB_SL2MA_CONN") == 0) {
            $('#commSl2Ma').text("OK");
        } else {
            $('#commSl2Ma').text("***");
        }

        /* Fantest already active */
        if (htmlAsNumber("#ENERGYGUI_FACTORY_TEST_FAN") == 1) {
            $("#fanTest").attr("disabled", false);
        }

        $("#inputBootReportSuccess").text(htmlAsNumber("#SYS_UPDATEBOOT_REPORT_SUCCESS") ? "OK" : "***");

        if (isSuperUser())
        {
            $('.superuser_only').show();
        }
        else
        {
            $('.superuser_only').hide();
        }

        if(isLoggedIn())
        {
            $('.autorisiert').show();

            $('.last_row').css({"margin-top": "10px", "margin-bottom": "90px"});

            // Check Lithium variable
            if(htmlAsNumber('#isLithium') == 1)
            {
                $('.pb_only').hide();
                $('.li_only').show();
            }
            else
            {
                $('.pb_only').show();
                $('.li_only').hide();
            }

            // Check if Studer Xtender
            if (htmlAsNumber("#BAT1TYPE") == 0)
            {
               $('.x_com').show();
               $('.senecbatt').hide();
            }
            else
            {
                $('.x_com').hide();
                $('.senecbatt').show();
            }

            // hide features in foreign countries
            if (htmlAsNumber("#FACTORYCOUNTRY") != 0 || // Not Germany
                htmlAsNumber("#FEATURESSOCKETS") == 0) // Feature not allowed
            {
                $('.germany_only').hide();
            }

            // Check MCU Type
            if (htmlAsNumber('#MCU_Type') == 2)
            {
                $('.V2_only').show();
            }
            else
            {
                $('.V2_only').hide();
            }

            if((htmlAsNumber('#FACTORYSYS_TYPE') >= 15) && (htmlAsNumber('#FACTORYSYS_TYPE') != 19))
            {
                $('.cBatteryWizard').show();
                $('.cBatteryWizardText').html(lng["lBatteryWizard"]);
            }
            else
            {
                $('.cBatteryWizard').hide();
                $('.cBatteryWizardText').hide();
            }

            if(htmlAsNumber('#FACTORYSYS_TYPE') == 19)
            {
                $('.cSamsungBatteryWizard').show();
                $('.cSamsungBatteryWizardText').html(lng["lBatteryWizard"]);
            }
            else
            {
                $('.cSamsungBatteryWizard').hide();
                $('.cSamsungBatteryWizardText').hide();
            }

             // Check if Steca
            if(htmlAsNumber("#BAT1TYPE") == 4)
            {
               $('.Steca_only').show();
               $('.not_Steca').hide();
            }
            else
            {
                $('.Steca_only').hide();
                $('.not_Steca').show();
            }
             
            if(htmlAsNumber('#FACTORYSYS_TYPE') == 18 && htmlAsNumber("#BAT1TYPE") == 4)
            {
                $('.StecaDuo_only').show();
            }
            else
            {
                $('.StecaDuo_only').hide();
            }
        }
        else
        {
            $('.autorisiert').hide();
            $('.last_row').css({"margin-top": "10px", "margin-bottom": "245px"});
        }

        if ($("#SOCKETSFORCE_ON0").html()*1 >= 1)
        {
            $("#inputSocket1ForceOn").attr("checked", true);
        }

        if ($("#SOCKETSFORCE_ON1").html()*1 >= 1)
        {
            $("#inputSocket2ForceOn").attr("checked", true);
        }

        $("#selftestTrigger").text(lng.lStartSelftest);

        var userLevel = htmlAsNumber('#LOGUSER_LEVEL');
        showUserLevel(userLevel);

        $('.pageinfo').addClass('hidden').hide();
        $('.pagecontent').removeClass('hidden').show();
    }

    function ChargebtnClickEvent()
    {
        if (chargeState == 1)// Testladung läuft
        {
            pageObj.handleButtonClick("ENERGY", "TEST_CHARGE_CHRG_STOP");

        }
        else
        {
            if ($('#itestpower').val())
            {
                pageObj.handleTextAreaUpdate("ENERGY", "GRID_POWER_OFFSET", "fl_" + (pageObj.float2hex($('#itestpower').val())));
                pageObj.handleButtonClick("ENERGY", "TEST_CHARGE_CHRG_START");
            }
            else
            {
                alert(lng.lSetupTestPowerError);
            }
        }
    }

    function DischargebtnClickEvent()
    {
        if (dischargeState == 1)// Testentladung läuft
        {
            pageObj.handleButtonClick("ENERGY", "TEST_CHARGE_DIS_STOP");
        }
        else
        {
            if ($('#itestpower').val())
            {
                pageObj.handleTextAreaUpdate("ENERGY", "GRID_POWER_OFFSET", "fl_" + (pageObj.float2hex($('#itestpower').val())));
                pageObj.handleButtonClick("ENERGY", "TEST_CHARGE_DIS_START");
            }
            else
            {
                alert(lng.lSetupTestPowerError);
            }
        }
    }

        }
        else
        {

        }
    }

    function UpdateIntegrationTest() {
        var value = 0;
        if ($('#AutoCycleEnable').prop('checked') == true)
        {
            value +=1;
        }
        if ($('#AutoInverterUpdate').prop('checked') == true)
        {
            value +=2;
        }
        if ($('#AutoNSPUpdate').prop('checked') == true)
        {
            value +=4;
        }

        pageObj.handleCheckBoxUpdate("ENERGY", "TEST_CYCLE", pageObj.castVarValue("u8", value));
    }

    function startGridParameterWizard() {
        if (htmlAsNumber("#FACTORYCOUNTRY") == 0)
        {
            if(($("#BAT1TYPE").html() * 1) < 3)
            {
                startWizard4105_2018();
            }
            else
            {
                startWizard4105_2019();
            }
        }
        if (htmlAsNumber("#FACTORYCOUNTRY") == 1)
        {
           startWizardCEI();
        }
        if (htmlAsNumber("#FACTORYCOUNTRY") == 2)
        {
            startWizardAU();
        }
    }

    function startPVWizard() {

            startWizardPv();

    }

    function fanTestProcess() {

        if(htmlAsNumber("#ENERGYGUI_FACTORY_TEST_FAN") == 0)
        {
            pageObj.handleCheckBoxUpdate("ENERGY", "GUI_FACTORY_TEST_FAN", "u8_01");
            // The button looks pressed for 1s
            $("#fanTest").attr("disabled", true);
            $("#fanTest").text(lng.lConfirmFanTest);
            console.log("star test");
        }
        else
        {
            pageObj.handleCheckBoxUpdate("ENERGY", "GUI_FACTORY_TEST_FAN", "u8_00");
            $("#fanTest").text(lng.lStartFanTest);
            console.log("stop test");
        }
    }

    function triggerSelftest()
    {
        console.log("Selftest triggered");
        pageObj.handleButtonClick("TEST","SELFTEST");
    }

    function triggerLogRotate()
    {
        console.log("Logfile rotate triggered");
        pageObj.handleButtonClick("DEBUG", "LOG_ROTATE");
    }

    function triggerLvUpdate()
    {
        console.log("Inverter V3 LV update triggered");
        pageObj.handleButtonClick("BAT1","REQ_LV_UPD");
    }

    function triggerHvUpdate()
    {
        console.log("Inverter V3 HV update triggered");
        pageObj.handleButtonClick("BAT1","REQ_HV_UPD");
    }
    
    function triggerNspUpdate()
    {
    	pageObj.handleButtonClick("SYS_UPDATE", "USER_REQ_NA_UPDATE");	
    }
    
    function triggerInverterUpdate()
    {
        pageObj.handleButtonClick("SYS_UPDATE", "USER_REQ_INV_UPDATE");  
    }


    $(document).bind("page.loaded", function() {
        $('#itestpower').keydown(function(event) {
            var key = event.keyCode;

            if (key == 13)
            {
                if ($('#itestpower').val())
                {
                    pageObj.handleTextAreaUpdate("ENERGY", "GRID_POWER_OFFSET", "fl_" + (pageObj.float2hex($('#itestpower').val())));
                }
                else
                {
                    alert(lng.lSetupTestPowerError);
                }
            }

        });

        $("a").unbind();
        $("a").click(function() {
            navigate(this.id);
        });
        updateLanguage();
        obj_init();
    });

    $(document).bind("page.unload", function() {
        pageObj.stopPageRefresh();
    });
</script>
