@keyframes blink {50% { color: transparent }}

<script type="text/javascript">
/** Prevent JSHint warning about supposingly unused functions. */
/* exported startSelftest, genPdf */
  var pageObj;
  var timerRunning;
    $(document).bind("page.loaded", function() {
        updateLanguage();
        obj_init();

    });

  var enableStartButton = function()
  {
    timerRunning = false;
    if(htmlAsNumber("#BAT1SELFTEST_OVERALL_STATE") != 1)
    {
      $('#startButton').removeAttr("disabled");
    }
  };

  $("#startButton").click(function() {
      $(this).attr("disabled", true);
      timerRunning=true ;
      setTimeout(function() { enableStartButton();}, 10000);
  });

  stateStrings = {
        0: "Undefined",
        1: "Running <span class=\"loader__dot\">.</span><span class=\"loader__dot\">.</span><span class=\"loader__dot\">.</span>",
        2: "Successful",
        3: "Failed",
        4: "Never Runned",
        5: "Not Started",
    };

function updateCB()
{
    for (c = 0; c < 8 ; ++c) 
  {
    if($('#BAT1SELFTEST_STEP'+c).html() == "")
    {
      $('#table'+c).hide();
    }
    else
    {
      $('#table'+c).show();
    }
  }

  $('#resultLabel').html("State: " + stateStrings[htmlAsNumber("#BAT1SELFTEST_OVERALL_STATE")]);
  $('#serialInverter').html("Serial Inverter: " + $('#BAT1SERIAL').html());
  $("#serialMCU").html("Serial MCU: S" + $("#FACTORYDEVICE_ID").html());

  if(!timerRunning && htmlAsNumber("#BAT1SELFTEST_OVERALL_STATE")!= 1)
  {
    enableStartButton();
  }
}

function singleUpdateCB()
{

  for (c = 0; c < 8 ; ++c) 
  {
    console.log($('#BAT1SELFTEST_STEP'+c).html());
    if($('#BAT1SELFTEST_STEP'+c).html() == "")
    {
      $('#table'+c).hide();
    }
    else
    {
      $('#table'+c).show();
    }
  }

  $('#resultLabel').html("State: " + stateStrings[htmlAsNumber("#BAT1SELFTEST_OVERALL_STATE")]);
  if(htmlAsNumber("#BAT1SELFTEST_OVERALL_STATE") == 1)
  {

  }

  $('#serialInverter').html("Serial Inverter: " + $('#BAT1SERIAL').html());
  $("#serialMCU").html("Serial MCU: S" + $("#FACTORYDEVICE_ID").html());

}

function obj_init() 
{
    pageObj = new senecPage(updateCB);

    pageObj.add_json_object("BAT1");
    pageObj.add_property_to_object("BAT1", "TRIG_ITALY_SELF","");
    pageObj.add_property_to_object("BAT1", "SELFTEST_STEP","");
    pageObj.add_property_to_object("BAT1", "SELFTEST_LIMIT","");
    pageObj.add_property_to_object("BAT1", "SELFTEST_ACT","");
    pageObj.add_property_to_object("BAT1", "SELFTEST_OFF","");
    pageObj.add_property_to_object("BAT1", "SELFTEST_TIME","");
    pageObj.add_property_to_object("BAT1", "SELFTEST_OVERALL_STATE","");
    pageObj.add_property_to_object("BAT1", "SELFTEST_STATE","");
    pageObj.add_property_to_object("BAT1", "SERIAL","");
    
    pageObj.singlePageRefresh();
    singleUpdateCB();
    pageObj.startPageRefresh(1000);
}

function startSelftest()
{
  pageObj.handleButtonClick("BAT1", "TRIG_ITALY_SELF");
}

$('#download').click(function() 
{
  var doc = new jsPDF('p', 'px', "a4");
  var width = doc.internal.pageSize.getWidth();
  var height = doc.internal.pageSize.getHeight();

  html2canvas(document.getElementById("pdfContent"), {
    dpi: 1200, // Set to 300 DPI
    scale: 4, // Adjusts your resolution
    }).then(function(canvas) {
      var img = canvas.toDataURL("image/jpeg");

      var logo = new Image();
      logo.src = "./img/Header_Logo.gif";
      doc.addImage(logo, 'gif', 0.1*width, 0.05*height, 0,0);
      doc.addImage(img, 'JPEG', 0, 0.15*height, width, 0);
      doc.save('autotest_result_S' + $("#FACTORYDEVICE_ID").html() + '.pdf');
    });
  });

</script>
