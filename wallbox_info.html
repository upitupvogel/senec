<script type="text/javascript">
/** Prevent JSHint warning about supposingly unused functions. */
/* exported set_limits */
    var pageObj;

    wallbox_hardware_name = {
        0: "141215",
        1: "160307",
        2: "170725",
        3: wallbox_unknown_hw_type
    };

    function singleUpdateCB()
    {
        // Show only activated devices
        for (c = 0; c < 4; c++) {
            if (htmlAsNumber('#WIZARDSETUP_NUMBER_WALLBOXES') > c)
            {
                $('.wallbox' + c).removeClass("hidden").show();
                $('.pageinfo').addClass("hidden").hide();
            }

            $("#gui_wallbox_name" + c).html(wallbox_adress_name + " " + htmlAsNumber("#WIZARDSETUP_WALLBOX_IDS" + c));

        }
    }

    function WallboxUpdateCB()
    {
        // Get Wallbox Data
        for (c = 0; c < 4; c++) {

            // If no communication error is active and wallbox is locked, overwrite with locked state
            if(htmlAsNumber("#WALLBOXSTATE" + c) != 0xF4 && htmlAsNumber("#WALLBOXPROHIBIT_USAGE" + c) >= 1)
            {
                $("#gui_wallbox_state" + c).html(lng.lWbProhibited);
            }
            else
            {
                $("#gui_wallbox_state" + c).html(wallbox_state_name[htmlAsNumber("#WALLBOXSTATE" + c)]);
            }

            $("#gui_wallbox_hw_type" + c).html(wallbox_hardware_name[htmlAsNumber("#WALLBOXHW_TYPE" + c)]);
            $("#gui_wallbox_revision" + c).html(htmlAsNumber("#WALLBOXMAJOR_REV" + c) + "." + htmlAsNumber("#WALLBOXMINOR_REV" + c));
            if(htmlAsNumber("#WALLBOXSTATE" + c) === 0xF4)
            {
                $("#gui_wallbox_hw_type" + c).html(wallbox_unknown_hw_type);
            }
            $("#gui_wallbox_total_power" + c).html(parseFloat($('#WALLBOXAPPARENT_CHARGING_POWER' + c).html()).toFixed(0));
            $("#gui_wallbox_l1_current" + c).html(parseFloat($('#WALLBOXL1_CHARGING_CURRENT' + c).html()).toFixed(1));
            $("#gui_wallbox_l2_current" + c).html(parseFloat($('#WALLBOXL2_CHARGING_CURRENT' + c).html()).toFixed(1));
            $("#gui_wallbox_l3_current" + c).html(parseFloat($('#WALLBOXL3_CHARGING_CURRENT' + c).html()).toFixed(1));
            $("#gui_wallbox_max_current" + c).html(parseFloat($('#WALLBOXMAX_CHARGING_CURRENT_IC' + c).html()).toFixed(1));
        }
    }

    function obj_init() {
        pageObj = new senecPage(singleUpdateCB);
        pageObj.add_json_object("WALLBOX");
        pageObj.add_json_object("WIZARD");
        pageObj.add_property_to_object("WIZARD", "SETUP_WALLBOX_IDS", "");
        pageObj.add_property_to_object("WIZARD", "SETUP_NUMBER_WALLBOXES", "");
        pageObj.add_property_to_object("WALLBOX", "HW_TYPE", "");
        pageObj.add_property_to_object("WALLBOX", "MAJOR_REV", "");
        pageObj.add_property_to_object("WALLBOX", "MINOR_REV", "");
        pageObj.add_property_to_object("WALLBOX", "STATE", "");
        pageObj.singlePageRefresh();

        pageObj.reInitJSONObject();
        pageObj = new senecPage(WallboxUpdateCB);
        pageObj.add_json_object("WALLBOX");
        pageObj.add_json_object("WIZARD");
        pageObj.add_property_to_object("WIZARD", "SETUP_WALLBOX_IDS", "");
        pageObj.add_property_to_object("WIZARD", "SETUP_NUMBER_WALLBOXES", "");
        pageObj.add_property_to_object("WALLBOX", "HW_TYPE", "");
        pageObj.add_property_to_object("WALLBOX", "APPARENT_CHARGING_POWER", "");
        
        pageObj.add_property_to_object("WALLBOX", "UTMP", "");
        pageObj.add_property_to_object("WALLBOX", "L1_CHARGING_CURRENT", "");
        pageObj.add_property_to_object("WALLBOX", "L2_CHARGING_CURRENT", "");
        pageObj.add_property_to_object("WALLBOX", "L3_CHARGING_CURRENT", "");
        pageObj.add_property_to_object("WALLBOX", "MAX_CHARGING_CURRENT_IC", "");
        pageObj.add_property_to_object("WALLBOX", "PROHIBIT_USAGE", "");
        pageObj.singlePageRefresh();
        pageObj.startPageRefresh(1000);
    }

    $(document).bind("page.loaded", function() {
        updateLanguage();
        obj_init();
    });

    $(document).bind("page.unload", function() {
        pageObj.stopPageRefresh();
    });
</script>
