<script type="text/javascript">
/** Prevent JSHint warning about supposingly unused functions. */
/* exported check_config */
    var pageObj;

    function singleUpdateCB() {
        // fill Peak Shaving controls
        if ($("#WIZARDPS_ENABLE").val() == 1) {
            $("#inputWizardPSEnabled").attr("checked", true);
        } else {
            $("#inputWizardPSEnabled").attr("checked", false);
        }

        $("#inputWizardPSReservoir").val($("#WIZARDPS_RESERVOIR").val());
        $("#inputWizardPSReservoir_num").val($("#WIZARDPS_RESERVOIR").val());
        $("#inputWizardPSHour").val($("#WIZARDPS_HOUR").val());
        $("#inputWizardPSMinute").val($("#WIZARDPS_MINUTE").val());

        $('.pageinfo').addClass('hidden').hide();
        $('.pagecontent').removeClass('hidden').show();
        
        if ($("#ENERGYZERO_EXPORT").html()*1 == 1)
        {
            alert(lng.lAlertZeroExportActive);
            $("#inputWizardPSEnabled").prop('disabled', true);
        }
    }

    function obj_init() {
        pageObj = new senecPage(singleUpdateCB);
        pageObj.add_json_object("WIZARD");
        pageObj.add_json_object("ENERGY");
        pageObj.add_property_to_object("WIZARD", "PS_ENABLE", "");
        pageObj.add_property_to_object("WIZARD", "PS_HOUR", "");
        pageObj.add_property_to_object("WIZARD", "PS_RESERVOIR", "");
        pageObj.add_property_to_object("WIZARD", "PS_MINUTE", "");
        pageObj.add_property_to_object("ENERGY", "ZERO_EXPORT", "");
        pageObj.singlePageRefresh();
    }

    $(document).bind("page.loaded", function() {
        updateLanguage();
        obj_init();
    });

    $(document).bind("page.unload", function() {
        pageObj.stopPageRefresh();
    });

    function check_config() {
        state = 1;
        errorMessage = 0;

        if (($("#inputWizardPSReservoir").val() > 100) ||
            ($("#inputWizardPSReservoir").val() < 0)) {
            errorMessage = lng.lPSerrorPercentage;
            state = 0;
        }

        if (($("#inputWizardPSMinute").val() > 59) ||
            ($("#inputWizardPSMinute").val() < 0) ||
            ($("#inputWizardPSHour").val() > 23) ||
            ($("#inputWizardPSHour").val() < 0)) {
            console.log("minute");
            errorMessage = lng.lPSerrorTime;
            state = 0;
        }

        if (state == 0)
            alert(errorMessage);
        else
            save_config();
    }

    function save_config() {
        pageObj.reInitJSONObject();
        pageObj.add_json_object("WIZARD");

        if ($('#inputWizardPSEnabled').prop('checked') == true) {
            pageObj.add_property_to_object("WIZARD", "PS_ENABLE", "u8_01");
        } else {
            pageObj.add_property_to_object("WIZARD", "PS_ENABLE", "u8_00");
        }

        pageObj.add_property_to_object("WIZARD", "PS_RESERVOIR", pageObj
                .castVarValue('u8', $('#inputWizardPSReservoir').val()));
        pageObj.add_property_to_object("WIZARD", "PS_HOUR", pageObj
                .castVarValue('u8', $('#inputWizardPSHour').val()));
        pageObj.add_property_to_object("WIZARD", "PS_MINUTE", pageObj
                .castVarValue('u8', $('#inputWizardPSMinute').val()));
        /* Set flag to trigger update of settings file. */
        pageObj.handleButtonClick("WIZARD", "CONFIG_MODIFIED_BY_USER");

        pageObj.singlePageRefresh();
    }
</script>

        <div class="row">

</div>
<div class="row">

            </div>

</div>

<div class="row">
