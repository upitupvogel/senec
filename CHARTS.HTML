    function Chart_init(chartView) {
        var statistics = 0;
        var ymax = 0;
        var ytick = 10;
        var plot_options = 0;
        var xticks=0;
        $("#chartdiv").empty();
        if (chartView != "OVERALL")
        {
            switch (chartView)
            {
                case "TODAY":
                    statistics = statisticsToday.chartData;
                    ymax = statisticsToday.maxValue;
                    xticks=statisticsToday.xaxisTicks;
                    break;
                case "YESTERDAY":
                    statistics = statisticsYesterday.chartData;
                    ymax = statisticsYesterday.maxValue;
                    xticks=statisticsYesterday.xaxisTicks;
                    break;
                case "WEEK":
                    statistics = statisticsWeek.chartData;
                    ymax = statisticsWeek.maxValue;
                    xticks=statisticsWeek.xaxisTicks;
                    break;
                case "MONTH":
                    statistics = statisticsMonth.chartData;
                    ymax = statisticsMonth.maxValue;
                    xticks=statisticsMonth.xaxisTicks;
                    break;
            }
            var htmlStyles = window.getComputedStyle(document.querySelector("html"));
            var mainColor = htmlStyles.getPropertyValue("--main-color");
            
            plot_options = {
                seriesDefaults: {
                    fill: true,
                    color: mainColor,
                    rendererOptions: {
                        smooth: true,
                        highlightMouseOver: false,
                        highlightMouseDown: false
                    }
                },
                axes: {
                    // Use a category axis on the x axis and use our custom ticks.
                    xaxis: {
                        tickRenderer: $.jqplot.CanvasAxisTickRenderer,
                        min:0,
                        tickInterval: 1,
                        numberTicks:statistics.length,
                        tickOptions: {
                            angle: -30,
                            fontSize: '10pt',
                            textColor: "#000000"
                        }
                        ,ticks:xticks
                   },
                    yaxis: {
                        min: 0,
                        max: ymax,                    
                        tickInterval: ytick,
                        tickOptions: {
                            fontSize: '10pt',
                            textColor: "#000000",
                        },
                        ticks: [[0, ""], [(ymax * 10) / 100, ""], [(ymax * 20) / 100, ""], [(ymax * 30) / 100, ""], [(ymax * 40) / 100, ""], [(ymax * 50) / 100, roundValue((ymax / 2), 2) + 'kW '], [(ymax * 60) / 100, ""], [(ymax * 70) / 100, ""], [(ymax * 80) / 100, ""], [(ymax * 90) / 100, ""], [ymax, roundValue(ymax, 2) + 'kW ']]//,

                    }

                    // Pad the y axis just a little so bars can get close to, but
                    // not touch, the grid boundaries.  1.2 is the default padding.

                }
            };
            // Ticks should match up one for each y value (category) in the series.
            try {
                autarkyCahrt = $.jqplot('chartdiv', [statistics], plot_options);
            } catch (e)
            {
                // alert('plot error...'+e); 
            }
        } else

        {

            var OverallStatistic_string = '<div class="row" style="margin-top:40px ; margin-bottom:80px">';
            //OverallStatistic_string+='<div class="row"><div class="span2 text-center"><p>'+lng["Today"]+'</p></div>';
            OverallStatistic_string += '<div class="span2 offset2" style="background-color:var(--sub-color); color: #ffffff;">'
            OverallStatistic_string += '<div class="row"><div class="span2 text-center"><p id="sOverallToday">0.0 kWh</p></div></div>';
            OverallStatistic_string += '<div class="row"><div class="span2 text-center"><p id="sOverallYesterday">0.0 kWh</p></div></div>';
            OverallStatistic_string += '<div class="row"><div class="span2 text-center"><p id="sOverallWeek">0.0 kWh</p></div></div>';
            OverallStatistic_string += '<div class="row"><div class="span2 text-center"><p id="sOverallMonth">0.0 kWh</p></div></div>';
            OverallStatistic_string += '<div class="row"><div class="span2 text-center"><p id="sOverallYear">0.0 kWh</p></div></div>';
            OverallStatistic_string += '<div class="row"><div class="span2 text-center"><p id="sOverallOverall">0.0 kWh</p></div></div>';
            OverallStatistic_string += '</div>';
            OverallStatistic_string += '<div class="span3 offsetmin">';
            OverallStatistic_string += '<div class="row"><div class="span2  text-left"><p>' + lng["TODAY"] + '</p></div></div>';
            OverallStatistic_string += '<div class="row"><div class="span2  text-left"><p>' + lng["YESTERDAY"] + '</p></div></div>';
            OverallStatistic_string += '<div class="row"><div class="span2  text-left"><p>' + lng["WEEK"] + '</p></div></div>';
            OverallStatistic_string += '<div class="row"><div class="span2  text-left"><p>' + lng["MONTH"] + '</p></div></div>';
            OverallStatistic_string += '<div class="row"><div class="span2  text-left"><p>' + lng["YEAR"] + '</p></div></div>';
            OverallStatistic_string += '<div class="row"><div class="span2  text-left"><p>' + lng["OVERALL"] + '</p></div></div>';
            OverallStatistic_string += '</div>';
            OverallStatistic_string += '</div>';
        }
        $("#chartdiv").append(OverallStatistic_string);
    }
