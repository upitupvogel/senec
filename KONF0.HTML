<script type="text/javascript">

    function updateKonfiguration()
    {
	var SystemType = ($('#ENERGYSYSTEMTYPE').html() * 1);
        
        //4,5,6 and are Li Systems
	if (SystemType >= 4 && SystemType <= 6)
	{
	    $('.pb_only').hide();
	    $('.li_only').show();
	}
	else
	{
	    $('.pb_only').show();
	    $('.li_only').hide();
	}
    }

    function obj_init()
    {
        pageObj = new senecPage("Konfiguration", updateKonfiguration);

        //add child object to parent object
        pageObj.add_json_object("ENERGY");

        // maintenance charge buttons and state
        pageObj.add_property_to_object("ENERGY", "SYSTEMTYPE", "");
        pageObj.singlePageRefresh();
    }

    $(document).bind("page.loaded", function() {
        $('#hCategoryName').empty();
        $('#hCategoryName').text("KONFIGURATION");
        $("a").unbind();
        $("a").click(function() {
            navigate(this.id);
        });
        
        obj_init();
    });



</script>
