<script type="text/javascript">
    var pageObj;
    function singleUpdateCB()
    {
        $('#ihours').val($("#RTCWEB_TIME_HOUR").html());
        $('#iminets').val($("#RTCWEB_TIME_MIN").html());
        $('#iday').val($("#RTCWEB_TIME_DAY").html());
        $('#imonth').val($("#RTCWEB_TIME_MONTH").html());
        $('#iyear').val($("#RTCWEB_TIME_YEAR").html() * 1);
        console.log("single update");
        console.log($("#RTCWEB_TIME_HOUR").html());
        console.log($("#RTCWEB_TIME_SYNC").html() * 1);
        if($("#RTCWEB_TIME_SYNC").html() * 1)
            {
                $('#inputFetchTimeOnline').attr("checked", true);
                lTimeSet.disabled = true;
            }else{
                $('#inputFetchTimeOnline').attr("checked", false);
            }        
    }
    
    $(document).bind("page.loaded", function() {
        $("a").unbind();
        $("a").click(function() {
            navigate(this.id);
        });
        updateLanguage();
        IndexPageObj.singlePageRefresh();
        singleUpdateCB();
    }
    );

    $('#inputFetchTimeOnline').change(function() {
        if ($('#inputFetchTimeOnline').prop('checked') == true)
        {
            IndexPageObj.handleCheckBoxUpdate("RTC", "WEB_TIME_SYNC", "u8_01");
            lTimeSet.disabled = true;
        }
        else
        {
            IndexPageObj.handleCheckBoxUpdate("RTC", "WEB_TIME_SYNC", "u8_00");
            lTimeSet.disabled = false;
        }
    });

</script>

        </div>             
        <div class="span7" style="background: var(--sub-color);">       
            <div style="margin-top: 4px;">  
                <div class="span1"><p><input type="text" class="span1" id="ihours" style="margin-left: 4px; height: 11px;font-size: 11px;line-height: 11px;"></p></div>
                <div class="span1 offset1"><p><input type="text" class="span1"  id="iminets" style="height: 11px;font-size: 11px;line-height: 11px;"></p></div>
            </div>
        </div> 
    </div>

    <div class="row">
        <div class="span10 labels_title">

            <div class="span1 offset1"><p class="text-center" id="lTimeMonth"></p></div>

    <div class="row">

        </div> 
        <div class="span7" style="background: var(--sub-color);">       
            <div style="margin-top: 4px;">    
                <div class="span1 "><p><input type="text" class="span1" id="iday" style="margin-left: 4px; height: 11px; font-size: 11px;line-height: 11px;"></p></div>
                <div class="span1 offset1"><p><input type="text" class="span1" id="imonth" style=" height: 11px; font-size: 11px;line-height: 11px;"></p></div>
                <div class="span1 offset1"><p><input type="text" class="span1" id="iyear" style="margin-left: -4px; height: 11px; font-size: 11px;line-height: 11px;"></p></div>
            </div>

    <div class="row">

                                                                                            $("#iminets").val(),
                                                                                            $("#iday").val(),
                                                                                            $("#imonth").val(),
                                                                                            $("#iyear").val(),
                                                                                            IndexPageObj);' id="lTimeSet"></button></p>
        </div>
